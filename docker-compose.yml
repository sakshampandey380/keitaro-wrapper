version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: keitaro_wrapper_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: keitaro_wrapper
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d keitaro_wrapper"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
